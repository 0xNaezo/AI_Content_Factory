  - platform: telegram
    language: es
    mode: real
    active: true
    auto_publish: false
    target: {chat_id: "@marea_fitness_es_demo"}
    schedule:
      slots:
        - {days: [1, 2, 3, 4, 5], times: ["07:30", "19:00"]}
        - {days: [6], times: ["09:30"]}
