<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
    .frame { width:100%; max-width:1200px; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 0.66rem 'Geist Mono',monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; font:400 28px/1.15 'Instrument Serif','Noto Serif',serif; letter-spacing:-0.02em; }
    svg { display:block; width:100%; min-width:960px; }
    svg .nm { fill:#2d3142; font:600 12px 'Geist',sans-serif; }
    svg .sb { fill:#4f5d75; font:400 9px 'Geist Mono',monospace; }
    svg .al { font:400 8px 'Geist Mono',monospace; letter-spacing:0.06em; }
    svg .tg { font:400 7px 'Geist Mono',monospace; letter-spacing:0.08em; }
    svg .zl { fill:#7a8399; font:500 8px 'Geist Mono',monospace; letter-spacing:0.14em; }
    svg .lg { fill:#4f5d75; font:400 8px 'Geist Mono',monospace; }
    svg .nt { fill:#4f5d75; font:italic 400 14px 'Instrument Serif',serif; }
    @media print {
      .diagram-container { overflow-x:visible; }
      svg { min-width:0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">State machine · imported from Mermaid · doc-inline · faithful</p>
    <h1>Material lifecycle</h1>
    <div class="diagram-container">

      <desc id="readme-3-desc">A material is received, parsed, optionally waits for the author, and ends either routed to a brand or rejected.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="960" height="600" fill="#f5f5f5"/>

    </div>
  </main>
</body>
</html>
