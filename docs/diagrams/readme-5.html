<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production ingress</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
    .frame { width:100%; max-width:1200px; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 0.66rem 'Geist Mono',monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; font:400 28px/1.15 'Instrument Serif','Noto Serif',serif; letter-spacing:-0.02em; }
    svg { display:block; width:100%; min-width:960px; }
    svg .nm { fill:#2d3142; font:600 12px 'Geist',sans-serif; }
    svg .sb { fill:#4f5d75; font:400 9px 'Geist Mono',monospace; }
    svg .al { font:400 8px 'Geist Mono',monospace; letter-spacing:0.06em; }
    svg .tg { font:400 7px 'Geist Mono',monospace; letter-spacing:0.08em; }
    svg .zl { fill:#7a8399; font:500 8px 'Geist Mono',monospace; letter-spacing:0.14em; }
    svg .lg { fill:#4f5d75; font:400 8px 'Geist Mono',monospace; }
    svg .nt { fill:#4f5d75; font:italic 400 14px 'Instrument Serif',serif; }
    @media print {
      .diagram-container { overflow-x:visible; }
      svg { min-width:0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · imported from Mermaid · fit 960 × 400 · faithful</p>
    <h1>Production ingress</h1>
    <div class="diagram-container">
    <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-5-title readme-5-desc">
      <title id="readme-5-title">Production ingress</title>
      <desc id="readme-5-desc">Internet traffic reaches only Caddy on port 443, which proxies the panel, blogs and brand domains to the web service and only the two webhook paths to n8n; the operator reaches n8n through an SSH tunnel.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="960" height="400" fill="#f5f5f5"/>
<g transform="translate(40,0)">
<path d="M176,160 H288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M448,148 H552 Q560,148 560,140 V100 Q560,92 568,92 H672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M448,172 H552 Q560,172 560,180 V220 Q560,228 568,228 H672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M176,288 H744 Q752,288 752,280 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="580" y="62" width="80" height="24" rx="2" fill="#f5f5f5"/><text x="620" y="71" class="al" fill="#7a8399" text-anchor="middle">PANEL, BLOGS,</text><text x="620" y="83" class="al" fill="#7a8399" text-anchor="middle">BRAND DOMAINS</text>
<rect x="574" y="186" width="92" height="36" rx="2" fill="#f5f5f5"/><text x="620" y="195" class="al" fill="#7a8399" text-anchor="middle">/webhook/tg</text><text x="620" y="207" class="al" fill="#7a8399" text-anchor="middle">/webhook/resend</text><text x="620" y="219" class="al" fill="#7a8399" text-anchor="middle">ONLY</text>
<rect x="418" y="258" width="84" height="24" rx="2" fill="#f5f5f5"/><text x="460" y="267" class="al" fill="#7a8399" text-anchor="middle">SSH TUNNEL TO</text><text x="460" y="279" class="al" fill="#7a8399" text-anchor="middle">127.0.0.1:5679</text>
<rect x="56" y="136" width="120" height="48" rx="24" fill="#f5f5f5"/>
<rect x="56" y="136" width="120" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="116" y="163.5" class="nm" text-anchor="middle">Internet</text>
<rect x="288" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="288" y="128" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="368" y="151.5" class="nm" text-anchor="middle">Caddy</text>
<text x="368" y="167.5" class="sb" text-anchor="middle">:443</text>
<text x="368" y="179.5" class="sb" text-anchor="middle">automatic + on-demand TLS</text>
<rect x="672" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="672" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="752" y="95.5" class="nm" text-anchor="middle">Web service</text>
<rect x="672" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="672" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="752" y="231.5" class="nm" text-anchor="middle">n8n</text>
<rect x="56" y="264" width="120" height="48" rx="6" fill="#f5f5f5"/>
<rect x="56" y="264" width="120" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="116" y="291.5" class="nm" text-anchor="middle">Operator</text>
</g>
<line x1="40" y1="344" x2="920" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<line x1="403.0" y1="365" x2="427.0" y2="365" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="435.0" y="368" class="lg">Internet traffic</text>
<line x1="549.4" y1="365" x2="573.4" y2="365" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="581.4" y="368" class="lg">Proxied</text>
<line x1="647.2" y1="365" x2="671.2" y2="365" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="679.2" y="368" class="lg">Admin only</text>
    </svg>
    </div>
  </main>
</body>
</html>
