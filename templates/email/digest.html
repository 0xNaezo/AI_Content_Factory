<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Helvetica,Arial,sans-serif;color:#18181b;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
      <tr><td style="background:{{color}};padding:24px 28px;color:#ffffff;">
        <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;">{{digest_title}}</div>
        <div style="font-size:24px;font-weight:bold;line-height:1.3;margin-top:6px;">{{brand_name}}</div>
        <div style="font-size:13px;opacity:.85;margin-top:4px;">{{period}}</div>
      </td></tr>
      <tr><td style="padding:24px 28px 8px 28px;font-size:16px;line-height:1.6;">{{{intro_html}}}</td></tr>
      {{#blocks}}
      <tr><td style="padding:16px 28px;">
        {{#image_url}}<img src="{{image_url}}" width="544" alt="" style="width:100%;max-width:544px;height:auto;border-radius:8px;display:block;margin-bottom:14px;">{{/image_url}}
        <div style="font-size:19px;font-weight:bold;line-height:1.35;margin-bottom:8px;">{{title}}</div>
        <div style="font-size:15px;line-height:1.6;color:#3f3f46;">{{{body_html}}}</div>
        {{#link_url}}<div style="margin-top:12px;"><a href="{{link_url}}" style="color:{{color}};font-weight:bold;text-decoration:none;">{{link_label}} →</a></div>{{/link_url}}
      </td></tr>
      <tr><td style="padding:0 28px;"><div style="border-top:1px solid #e4e4e7;"></div></td></tr>
      {{/blocks}}
      {{#cta_url}}
      <tr><td align="center" style="padding:24px 28px;">
        <a href="{{cta_url}}" style="display:inline-block;background:{{color}};color:#ffffff;font-weight:bold;font-size:15px;padding:12px 26px;border-radius:8px;text-decoration:none;">{{cta_text}}</a>
      </td></tr>
      {{/cta_url}}
      <tr><td style="padding:20px 28px 28px 28px;font-size:12px;line-height:1.6;color:#71717a;">
        {{footer_text}}<br>
        <a href="{{blog_url}}" style="color:#71717a;">{{blog_url}}</a> ·
        <a href="{{{unsubscribe_url}}}" style="color:#71717a;">Unsubscribe</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
