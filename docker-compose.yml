# AI Content Factory — local stack. Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# n8n: http://localhost:5679 (5678 is taken by Greeter), web: http://localhost:3001, Postgres: localhost:5433, S3 console: http://localhost:9001
name: ai_content_factory

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?}
      APP_N8N_PASSWORD: ${APP_N8N_PASSWORD:?}
      APP_WEB_PASSWORD: ${APP_WEB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    <<: *restart
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || curl -fs http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:2.40.7
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Empty in dev = key from the n8n_data volume. Required (and backed up separately) in prod.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      N8N_WEBHOOK_URL: ${PUBLIC_N8N_URL:-http://localhost:5679/}
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "40"
      N8N_PAYLOAD_SIZE_MAX: "64"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks: [default, telegram]

  # Egress proxy: injects TELEGRAM_BOT_TOKEN so the token never lives in n8n (the Bot API needs it in the URL path).
  egress:
    <<: *restart
    image: caddy:2.11-alpine
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-missing-token}
    volumes:
      - ./infra/egress.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [telegram]

  # Internal document utilities: DOCX/URL text extraction (SSRF-guarded), link checks, YAML, JSON Schema validation.
  extractor:
    <<: *restart
    build: ./extractor
    volumes:
      - ./schemas:/app/schemas:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *restart
    build: ./web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_web:${APP_WEB_PASSWORD}@postgres:5432/app
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: ${S3_BUCKET:-acf}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      N8N_CMD_URL: http://n8n:5678/webhook/cmd
      N8N_CMD_SECRET: ${WEB_CMD_SECRET}
      SESSION_SECRET: ${WEB_SESSION_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"

  # Fake Telegram / Anthropic / OpenRouter / Resend for automated end-to-end tests (scripts/e2e.sh).
  stub:
    profiles: [test]
    image: node:22-alpine
    command: ["node", "/stub/server.mjs"]
    volumes:
      - ./stub:/stub:ro
    ports:
      - "127.0.0.1:3902:3000"
    networks: [default, telegram]

volumes:
  pg_data:
  s3_data:
  n8n_data:

networks:
  default:
  telegram:
