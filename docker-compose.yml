# Local n8n for AI Content Factory. Port 5679 (5678 is taken by Greeter).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${GENERIC_TIMEZONE:-Europe/Moscow}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
